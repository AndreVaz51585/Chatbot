services:
  chatbot:
    build: .
    container_name: evolab-chatbot-api
    restart: unless-stopped
    ports:
      - "${CHATBOT_PORT:-8000}:8000"
    environment:
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:?GOOGLE_API_KEY is required}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.0-flash-lite}"
      GEMINI_TEMPERATURE: "${GEMINI_TEMPERATURE:-0.2}"
      EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-models/gemini-embedding-001}"
      CHROMA_COLLECTION_NAME: "${CHROMA_COLLECTION_NAME:-evolab_gemini_embedding_001}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      CHROMA_PATH: "/app/chroma_db"
      DATA_DIR: "/app/data"
    volumes:
      - ./data:/app/data:ro
      - ./chroma_db:/app/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
